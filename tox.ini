[tox]
envlist =
    py310
    py311
    py312
    py313
    py314
    py315
    docs
    ruff
; mypy
; codespell
skip_missing_interpreters = True

[testenv]
deps =
    -r{toxinidir}/tests/requirements.txt
    pyright
commands =
    pyright
    py.test --basetemp="{envtmpdir}" --confcutdir=.. {posargs}
skip_install = true

[testenv:mypy]
changedir =
basepython = python3
deps = mypy
commands = mypy {toxinidir}/progressbar

[testenv:docs]
changedir =
basepython = python3
deps = -r{toxinidir}/docs/requirements.txt
allowlist_externals =
    rm
    mkdir
whitelist_externals =
    rm
    cd
    mkdir
commands =
    rm -f docs/modules.rst
    mkdir -p docs/_static
    sphinx-apidoc -e -o docs/ progressbar */os_specific/*
    rm -f docs/modules.rst
    sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html {posargs}

[testenv:ruff]
commands =
    ruff check
    ruff format --check
deps = ruff
skip_install = true

[testenv:codespell]
changedir = {toxinidir}
commands = codespell .
deps = codespell
skip_install = true
command = codespell
