name: docs console

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  console:
    name: in-browser console smoke test
    runs-on: ubuntu-latest
    # Task 18's wheel build, a real Pyodide runtime download from jsdelivr,
    # and Chromium's own download can all be slow on a cold CI cache; 20
    # minutes leaves headroom without letting a genuine hang run forever.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tox
          python -m pip install -e '.[docs-tests]'
          python -m playwright install --with-deps chromium
      - name: Build the docs
        run: tox -e docs
      - name: Run the console smoke test
        run: python -m pytest tests/console -v --no-cov
      - name: Upload the built docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
